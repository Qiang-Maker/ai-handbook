# Nginx 配置文件示例 (宝塔 / 原生 Nginx 均适用)
# 放在对应 server 块中：

server {
    listen 80;
    server_name your-domain.com; # 替换成你的域名

    root /path/to/your/site; # 替换成实际站点目录路径
    index index.html;

    # 字符集
    charset utf-8;

    # 关键：VitePress cleanUrls 伪静态重写支持
    # 优先匹配原文件 -> 匹配目录/index.html -> 匹配 $uri.html -> 最后 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 静态静态资源长缓存
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
